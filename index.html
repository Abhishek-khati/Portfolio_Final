    <!-- Theme Colors -->
    <meta name="theme-color" content="#06080F" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F8FAFD" media="(prefers-color-scheme: light)" />
    <!-- Prevent theme flash on initial load -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
          } else {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
    <title>Abhishek Khati — Data Analytics · AI · Technology</title>
